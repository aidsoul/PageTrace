<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Градиент фона иконки -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Свечение и градиент маркера подсветки -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Мягкая тень под листом страницы -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Закругленная подложка иконки (Squircle) -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Лист документа / веб-страница -->
  <rect x="26" y="22" width="76" height="84" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2.5" filter="url(#cardShadow)"/>

  <!-- Структурные строки страницы (DOM / заголовки и текст) -->
  <rect x="38" y="36" width="30" height="5" rx="2.5" fill="#64748B"/>
  <rect x="38" y="48" width="52" height="5" rx="2.5" fill="#475569"/>

  <!-- Подсвеченная строка (Световой след / Trace) -->
  <!-- Фоновый ореол подсветки маркера -->
  <rect x="34" y="61" width="60" height="16" rx="4" fill="#FDE047" fill-opacity="0.22"/>
  <!-- Яркая линия совпадения текста -->
  <rect x="38" y="66" width="46" height="6" rx="3" fill="url(#highlightGrad)"/>

  <!-- Нижние строки структуры -->
  <rect x="38" y="84" width="52" height="5" rx="2.5" fill="#475569"/>
  <rect x="38" y="94" width="24" height="5" rx="2.5" fill="#334155"/>

  <!-- Акцентная точка / маркер попадания -->
  <circle cx="89" cy="69" r="4.5" fill="#FDE047"/>
</svg>
